[mod-setting-description]
mdpy-cargo-ships-compatibility=Changes technologies and recipes for the Cargo Ships mod resulting in cargo ships that are in line with tier 1 trains.
mdpy-container-cargo-ship-compatibility=Makes a new technology for Container Cargo Ship and puts it along side Tier 2 trains. Updates the ship with more speed and updates the recipe.
mdpy-nanobots-compatibility=Changes technologies and recipes for the Nanobots mod resulting in nanobots that can be obtained earlier.
mdpy-miniloader-compatibility=Changes the science pack costs to be in line with the rest of Pyanodons.
mdpy-shield-projector-compatibility=Changes technologies and recipes for Shield Projectors to make them more in line with Pyanodons.
mdpy-dectorio-compatibility=Makes the lawn mower research cost more in line with where it is in the tree.
mdpy-spacemod-compatibility=Changes technologies and recipes for the Space Extension mod resulting in an experience more in line with a Pyanodon endgame (you know, if you are absolutely mad).
mdpy-spacemod-hardcore=Building ingredients in Space Extension recipes will be multiplied by the Space Extension Mod production cost multiplier (for the truly insane).
mdpy-robo-start=Give yourself a few things to get access to a few construction bots at the start. If you turned on marathon mode feel free to turn this on, you earned it.
mdpy-military-start=Give yourself extra bullets (Or just bullets if playing PyHM) and some walls and turrets at the start of the game.
mdpy-pyblock-start=Give yourself a few starting buildings that lead up to iron / copper creation. Generally only useful with marathon enabled since it makes some recipes too expensive for starting amounts.
mdpy-marathon=Most end products have their ingredients multiplied by the marathon multiplier. If end products are ingredients, they are not multiplied. See? I can be reasonable.
mdpy-marathon-plus=All ingredients (besides a small subset) are now eligible for multiplication. Let the madness begin...
mdpy-marathon-multi=A gauge of how much pain you want to inflict upon yourself. Also indicates how much recipes are multiplied by. That 3x setting adds up a lot faster than you might think!
mdpy-tech-marathon=Think it is not enough to crank up the technology multiplier? Why not increase the ingredient costs too!?
mdpy-ultra-marathon=I see we have a connoisseur among us. Many intermediate products are now affected by the ultra marathon multiplier. For those times when you are simply not interested in making progress in the game, especially at high ultra multipliers.
mdpy-ultra-marathon-multi=A gauge of how far into the abyss you have peered. It is highly recommended not to set this very high given the extreme length of some production chains. But I know you will ignore my advice and just max it all out - I salute you! Note: Ingredients will be rounded to the nearest whole number when decimals are involved.
mdpy-marathon-blocklist=Put any recipes by name in a comma separated list with no spaces to disable multiplication on those recipes. If something is totally game breaking or just too annoying to deal with, add it here. We will understand...
mdpy-marathon-ing-blocklist=Put any ingredients by name in a comma separated list with no spaces to disable multiplication of those ingredients in any recipes.

[item-description]
assembly-robot=Assembly robots are the pinnacle of automated construction. These massive autonomous machines are capable of operating on massive construction projects in space thanks to their advanced AI and mechanical components and the addition of a highly efficient miniaturized fusion reactor.
drydock-assembly=A single Drydock assembly component is a monstrous factory powered by advanced construction machines and robots. It is powered by a vast array of solar panels and accumulators to ensure constant construction. The already advanced logistics network is advanced by an array of highly advanced processors to ensure precision construction of a ship capable of FTL travel. Imagine what an array of these could accomplish!
drydock-structural=Drydock structural components are a world tour of high end materials built to hold up against the rigorous construction methods used during space ship construction as well as the occasional impact.
fusion-reactor=An unimaginable amount of energy is required to power the ships systems and kickstart the FTL drive. Fortunately, a revolutionary advancement in fusion technology has been made! It turns out that by firing antimatter through an array of particle accelerators enhanced by advanced superconductor technology, the full yield can be drawn out almost instantly. The reaction has to take place within a perfectly fine tuned reflective vacuum chamber protected by an advanced protection field. A solar tower building is repurposed to cooridinate this nearly magical dance of high energy acrobatics. Since the process is so intense, a huge array of automated factories, foundaries, and crushers are constantly crushing captured space rocks and smelting the constituents into rare materials which are then used to construct replacement parts for the energy containment fields on the fly.
hull-component=Built to withstand the rigors of interstellar space at faster than light speeds, these hull components use advanced materials configured in a revolutionary way.
protection-field=A pair  of MK2 energy shields, once enhanced with advanced super conducting components, can have its power output exponentially increased. Preliminary tests show that it should be able to withstand FTL travel. However, the power source to run this array at full strength will need to be quite impressive.
space-thruster=By supercharging centrifuges with an array of superconducting engines we are able to extract exotic particles from fuel cells prepared on Navis. These particles are then accelerated to relativistic speeds and then beamed through a specialized quasicrystal matrix. By using this technique we are able to produce a surprising amount of thrust for a very tiny amount of input.
fuel-cell=The advanced process used by thrusters on the spaceship requires a mix of rare elements that must be prepared and contained perfectly on Navis. A magnetic chamber holds the rare elements in stasis powered by an array of quantum batteries to be used during transit.
habitation=All the best logistics and small machinery is deployed to make life aboard the interstellar ship enjoyable. Every single desire is but a thought away as bots, belts, and grabbers go out of their way to get you want you want at a moments notice.
life-support=The tastiest plants and animals are combined with advanced logistic and mechanical systems to create a fully sustainable source of all kinds of delicious bio material. Tholin extractors are able to draw the tiny amounts of tholins that float around space to sustain the base materials needed for growth. Using the scrumptious biomass, bio printers turn it into any meal imaginable chemical plants are used to provide a wide array of flavor additives.
command=A feat of engineering and logistics, the command center allows the pilot to control all ship systems from a single place.
astrometrics=The calculations required to travel though space at high speeds are quite intense, requiring quantum computers to even come close to being able to perform the task. These quantum computers are made more effective using a variety of high tech quantum materials. In order to keep the computers cool while they run, advanced coolers and cryostats are paired with an array of metastable elements mixed with stranglets which allow us to pump heat into adjacent dimensions.
ftl-drive=At the edge of possibility lies the FTL drive. The true nature of the drive is a four dimensional entity, similar to a tesseract. Unfortunately, in our world we can only see in three dimensions. In order to create the substructure of the drive a large number of the most advanced nuclear reactors are stripped down and reconfigured to form a single three dimensional slice of the overall drive. Then using advances in multidimensional technology, the entire three dimensional drive slice is rotated into the fourth dimension by bombarding it with strangelets that have been accelerated to relativistic speeds and fired through the horns of dimension hopping antelopes. Once completed the FTL drive is kickstarted by expending 99.99% of the material kept within the onboard fusion reactors, a truly incomprehensible amount of energy. Once activated, specialized Dingrit-powered generators (enhanced with super fluids and other dimensional materials) are employed with an army of dimensional antelopes. Once up to speed, the antelopes start dimension hopping and the onboard supercharged quantum computing arrays are able to use the seemingly random dimensional jump patterns to calculate the firing solution to punch a hole in reality using a proprietary mix of strangelets, tholins, and dimensional gastricorgs. A wormhole is effectively generated allowing the ship to make an apparent faster than light move even though many would say it is cheating.
spacex-combinator=The SpaceX combinator not only displays the current progress of the SpaceX program but it also calculates very precise estimates for how many of each component is required.

[map-gen-preset-name]
md-marathon-islands=Mad Duck's Marathon Islands

[map-gen-preset-description]
md-marathon-islands=Play on large islands with spread out dense resources. Make use of trains and cargo ships! Turn on biters for some extra fun (Only destroying spawners will increase evolution - create alien zoos!)